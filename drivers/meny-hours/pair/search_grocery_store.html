<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="pair.grocery.pair_title">Grocery store</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 0 16px 24px;
      margin: 0;
    }
    h2 {
      margin-top: 12px;
      margin-bottom: 8px;
      font-size: 1.25rem;
    }
    .hint {
      color: #888;
      font-size: 0.9rem;
      margin: 0 0 12px;
      line-height: 1.35;
    }
    label {
      display: block;
      margin-top: 8px;
      font-weight: 500;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #aaa;
    }
    #q {
      width: 100%;
      max-width: 100%;
      min-height: 44px;
      font-size: 16px;
      padding: 10px 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #111;
      color: #fff;
    }
    #status {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #888;
      min-height: 1.2em;
    }
    #results {
      margin-top: 12px;
      max-height: min(52vh, 420px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0a0a0a;
    }
    .result-row {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      min-height: 44px;
      box-sizing: border-box;
      border: none;
      border-bottom: 1px solid #222;
      background: transparent;
      color: #eee;
      font-size: 15px;
      line-height: 1.3;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .result-row:last-child {
      border-bottom: none;
    }
    .result-row:active {
      background: #222;
    }
    .result-row.is-selected {
      background: #2a1515;
      box-shadow: inset 3px 0 0 #e32d22;
    }
    #next {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #e32d22;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #next:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: #333;
      color: #888;
    }
  </style>
</head>
<body>
  <h2 data-i18n="pair.grocery.pair_heading">Find your store</h2>
  <p class="hint" data-i18n="pair.grocery.pair_hint">Search by name, place or store code, then tap a row and continue.</p>
  <p>
    <label data-i18n="pair.grocery.search_label">Search</label>
    <input type="search" id="q" autocomplete="off" enterkeyhint="search" />
  </p>
  <div id="status" aria-live="polite"></div>
  <div id="results" role="listbox" aria-label="Stores"></div>
  <button type="button" id="next" data-i18n="pair.grocery.next" disabled>Next</button>
  <script src="search_grocery_store.js"></script>
</body>
</html>
