<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"
	integrity="sha512-nMNlpuaDPrqlEls3IX/Q56H36qvBASwb3ipuo3MxeWbsQB1881ox0cRv7UPTgBlriqoynt35KjEwgGUeUXIPnw=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<header class="homey-header">
	<h1 class="homey-title">
		<!-- This will be filled with the translated string with key 'settings.title'. -->
	</h1>
	<p class="homey-subtitle">
		<!-- This will be filled with the translated string with key 'settings.subtitle'. -->
	</p>
</header>
<fieldset class="homey-form-fieldset">
	<div id="step1" class="homey-form-group">
		<label for="region" class="homey-form-label"><span data-i18n="waterTemperature.pair.region"></span></label>
		<select id="region" style="width: 100%;"></select>
	</div>
	<div id="step2" class="homey-form-group" style="display:none;">
		<label for="changeRegion" class="homey-form-label">
			<a href="#" id="changeRegion" data-i18n="waterTemperature.pair.changeRegion"></a>
		</label>
		<label for="bathingSpot" class="homey-form-label"><span data-i18n="waterTemperature.pair.label"></span></label>
		<select id="bathingSpot" style="width: 100%;"></select>
	</div>
</fieldset>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"
	integrity="sha512-2ImtlRlf2VVmiGZsjm9bEyhjGW4dU7B6TNwh/hx/iSByxNENtj3WVE6o/9Lj4TJeVXPi4bnOIMXFIJJAeufa0A=="
	crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="application/javascript">
	Homey.setTitle(Homey.__("waterTemperature.pair.title"));
	Homey.setSubtitle(Homey.__("waterTemperature.pair.desc"));
	$(document).ready(function () {
		setTimeout(async function () {
			let coords;
			let selectedRegionId;
			let isRepair = false;

			const t = (key) => Homey.__(`waterTemperature.pair.${key}`);

			try {
				isRepair = (await Homey.emit('isRepair')) === true;
			} catch (error) {
				isRepair = false;
			}

			Homey.emit('getLocation').then(function (result) {
				coords = result;
			}).catch(function () {
				coords = null;
			});

			function haversineDistance(lat1, lon1, lat2, lon2) {
				const R = 6371;
				const dLat = (lat2 - lat1) * (Math.PI / 180);
				const dLon = (lon2 - lon1) * (Math.PI / 180);
				const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
					Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
					Math.sin(dLon / 2) * Math.sin(dLon / 2);
				const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
				return R * c;
			}

			function showRegionStep() {
				$('#step2').hide();
				$('#step1').show();
				const $bathingSpot = $('#bathingSpot');
				if ($bathingSpot.hasClass('select2-hidden-accessible')) {
					$bathingSpot.select2('destroy');
				}
				$bathingSpot.empty();
			}

			$('#changeRegion').on('click', function (event) {
				event.preventDefault();
				showRegionStep();
			});

			Homey.emit("getRegions").then(function (result) {
				$('#region').select2({
					placeholder: t('selectRegion'),
					allowClear: true,
					data: [
						{ id: '', text: t('selectRegion') },
						...result.map(item => ({
							id: item.id,
							text: item.name
						}))
					]
				});
				$('#region').val('').trigger('change');
			}).catch(function (error) {
				console.error('Error fetching regions:', error);
				$('#region').append(new Option(t('regionsFailed'), '', true, true));
			});

			$('#region').on('select2:select', async function (e) {
				const selectedRegion = e.params.data;
				if (!selectedRegion.id) {
					return;
				}

				selectedRegionId = selectedRegion.id;
				$('#step1').hide();
				$('#step2').show();

				const $bathingSpot = $('#bathingSpot');
				if ($bathingSpot.hasClass('select2-hidden-accessible')) {
					$bathingSpot.select2('destroy');
				}
				$bathingSpot.empty().append(new Option(t('loadingSpots'), '', true, true));

				try {
					const tempData = await Homey.emit("getTemperatures", selectedRegion.id);
					$bathingSpot.empty();

					if (tempData && tempData.length > 0) {
						$bathingSpot.append(new Option(t('selectSpot'), '', true, true));
						tempData.forEach(spot => {
							if (!spot?.locationId || !spot?.name) {
								return;
							}

							let distanceText = '';
							const position = spot.position;
							if (coords && position?.lat != null && position?.lon != null) {
								const distance = haversineDistance(
									coords.lat,
									coords.lon,
									position.lat,
									position.lon
								);
								distanceText = ` - ${distance.toFixed(2)} km`;
							}

							const tempLabel = spot.temperature != null ? `${spot.temperature}°C` : '–';
							const option = new Option(
								`${spot.name} (${tempLabel})${distanceText}`,
								spot.locationId,
								false,
								false
							);
							$(option).data('spot', spot);
							$bathingSpot.append(option);
						});
						$bathingSpot.select2({
							placeholder: t('selectSpot')
						});
					} else {
						$bathingSpot.append(new Option(t('noSpots'), '', true, true));
					}
				} catch (error) {
					console.error('Error fetching water temperatures:', error);
					$bathingSpot.empty().append(new Option(t('spotsFailed'), '', true, true));
				}
			});

			$('#bathingSpot').on('select2:select', async function () {
				const option = $(this).find('option:selected');
				const spot = option.data('spot');
				if (!spot?.locationId || !spot?.name || !spot?.position) {
					return;
				}

				const spotData = {
					id: spot.locationId,
					name: spot.name,
					regionId: selectedRegionId,
					county: spot.regionName || '',
					municipality: spot.municipalityName || '',
					position: spot.position,
					temperature: spot.temperature,
					time: spot.time,
					sourceDisplayName: spot.sourceDisplayName || 'yr.no'
				};

				await Homey.emit('saveBathingSpot', spotData);

				if (isRepair) {
					await Homey.done();
					return;
				}

				await Homey.emit('list_devices');
				await Homey.nextView();
			});

		}, 1000);
	});
</script>
