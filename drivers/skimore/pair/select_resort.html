<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="pair.skimore.title">Select resort</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"
    integrity="sha512-nMNlpuaDPrqlEls3IX/Q56H36qvBASwb3ipuo3MxeWbsQB1881ox0cRv7UPTgBlriqoynt35KjEwgGUeUXIPnw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 0 16px;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: 500;
    }
    #next {
      margin-top: 24px;
      padding: 10px 24px;
      font-size: 16px;
    }
    #next:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .select2-container {
      width: 100% !important;
      max-width: 100%;
    }
    .select2-container--default .select2-selection--single {
      min-height: 44px;
      padding: 6px 8px;
    }
  </style>
</head>
<body>
  <h2 data-i18n="pair.skimore.select_resort">Select resort</h2>
  <p>
    <label data-i18n="pair.skimore.resort_label">Resort:</label>
    <select id="resort" disabled></select>
  </p>
  <button id="next" data-i18n="pair.skimore.next" disabled>Next</button>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"
    integrity="sha512-2ImtlRlf2VVmiGZsjm9bEyhjGW4dU7B6TNwh/hx/iSByxNENtj3WVE6o/9Lj4TJeVXPi4bnOIMXFIJJAeufa0A=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="select_resort.js"></script>
</body>
</html>
