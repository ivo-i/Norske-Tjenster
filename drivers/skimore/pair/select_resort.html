<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="pair.skimore.title">Select Resort</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 0 16px;
    }
    select {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #ccc;
      margin-top: 4px;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: 500;
    }
    #next {
      margin-top: 24px;
      padding: 10px 24px;
      font-size: 16px;
    }
    #next:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h2 data-i18n="pair.skimore.select_resort">Select resort</h2>
  <p>
    <label data-i18n="pair.skimore.resort_label">Resort:</label>
    <select id="resort" disabled>
      <option value="">Loading...</option>
    </select>
  </p>
  <button id="next" data-i18n="pair.skimore.next" disabled>Next</button>
  <script src="select_resort.js"></script>
</body>
</html>
